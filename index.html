        <h1>Quick photo edits, <em>privately</em>.</h1>
        <p>Free, no ads, no account. Your photo never leaves this device.</p>
        <div class="row-center"><button class="primary big" id="btn-open-2">Choose a photo</button><button class="big" id="btn-new-2">New blank image</button></div>

    <section class="dock props panel" id="panel" role="tabpanel" aria-label="Tool options" aria-live="polite"></section>
    <section class="dock history-dock panel" id="history-dock" role="tabpanel" aria-label="History"></section>
    <section class="dock layers-dock panel" id="layers-dock" role="tabpanel" aria-label="Layers"></section>
  </aside>

  <input type="file" id="file" accept="image/*,.psd,image/vnd.adobe.photoshop" hidden>
  <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
</div>

<template id="tpl-export">
  <label>Format
    <div class="seg" data-name="format" role="radiogroup" aria-label="Format">
      <button data-v="image/png" role="radio">PNG</button><button data-v="image/jpeg" role="radio">JPG</button><button data-v="image/webp" role="radio">WebP</button><button data-v="image/vnd.adobe.photoshop" role="radio" title="Photoshop file with layers">PSD</button>
    </div>
  </label>
  <label class="q-row"><span class="lab">Quality <output></output></span><input type="range" name="quality" min="10" max="100" value="85" aria-label="Quality"></label>
  <label><span class="lab">Size <output></output></span><input type="range" name="scale" min="10" max="100" value="100" step="5" aria-label="Size"></label>
  <label>File name<input type="text" name="filename" autocomplete="off" spellcheck="false"></label>
  <p class="meta" id="export-meta">Calculating…</p>
  <div class="row">
    <button class="primary grow" data-action="download" aria-describedby="export-meta">Download</button>
    <button data-action="copy" title="Copy to clipboard">Copy</button>
  </div>
  <p class="note">Saved images contain no location or camera data (EXIF is stripped).</p>
</template>
<script type="module" src="js/main.js"></script>
</body>
</html>
