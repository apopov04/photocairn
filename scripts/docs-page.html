<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Generated by scripts/api-docs.mjs from scripts/docs-guide.md and js/api-spec.js. Edit those, then run: npm run docs -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photocairn for developers and AI agents</title>
<meta name="description" content="How Photocairn works, every tool and shortcut, and the window.photocairn scripting API that lets AI agents edit photos in the browser.">
<link rel="canonical" href="https://photocairn.silicairn.com/developers/">
<link rel="alternate" type="text/plain" href="../llms-full.txt" title="llms-full.txt">
<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<meta property="og:title" content="Photocairn for developers and AI agents">
<meta property="og:description" content="Every tool, shortcut and the window.photocairn scripting API.">
<meta property="og:url" content="https://photocairn.silicairn.com/developers/">
<meta property="og:image" content="https://photocairn.silicairn.com/docs/screenshot.png">
<style>
:root {
  --bg: #f6f6f8; --surface: #ffffff; --surface-2: #efeff3; --line: #e2e2e8;
  --text: #17171b; --muted: #6c6c75; --accent: #0F5468;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #111214; --surface: #1b1c20; --surface-2: #25262b; --line: #2f3036; --text: #ececf1; --muted: #9a9aa5; --accent: #4FA3BA; }
}
* { box-sizing: border-box; }
html { scroll-padding-top: 64px; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 var(--font); -webkit-font-smoothing: antialiased; }
a { color: var(--accent); }
header { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 12px; padding: 10px 20px; background: var(--surface); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 650; color: var(--text); text-decoration: none; }
header .open { margin-left: auto; padding: 7px 14px; border-radius: 10px; background: var(--accent); color: #fff; text-decoration: none; font-weight: 600; font-size: 14px; }
.layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 32px; max-width: 1180px; margin: 0 auto; padding: 24px 20px 80px; }
nav.toc { position: sticky; top: 72px; align-self: start; display: flex; flex-direction: column; gap: 2px; font-size: 13.5px; max-height: calc(100vh - 90px); overflow: auto; }
nav.toc a { color: var(--muted); text-decoration: none; padding: 4px 8px; border-radius: 8px; }
nav.toc a:hover { background: var(--surface-2); color: var(--text); }
main { min-width: 0; }
h1 { font-size: 30px; letter-spacing: -.02em; line-height: 1.2; margin: 8px 0 12px; }
h2 { font-size: 22px; margin: 44px 0 10px; padding-top: 16px; border-top: 1px solid var(--line); letter-spacing: -.01em; }
h3 { font-size: 17px; margin: 28px 0 8px; }
h4 { font-size: 15px; margin: 26px 0 6px; }
h4 { margin-top: 30px; }
h4 code { font-size: 14.5px; font-weight: 650; color: var(--accent); background: var(--surface); border: 1px solid var(--line); padding: 4px 9px; border-radius: 8px; display: inline-block; }
p, ul { margin: 8px 0; }
ul { padding-left: 22px; }
li { margin: 3px 0; }
code { font: 13px var(--mono); background: var(--surface-2); padding: 1px 5px; border-radius: 5px; }
pre { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; overflow: auto; }
pre code { background: none; padding: 0; font-size: 12.5px; line-height: 1.55; }
blockquote { margin: 12px 0; padding: 10px 14px; background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 10px; }
.table { overflow-x: auto; margin: 10px 0; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; background: var(--surface); border-radius: 10px; }
th, td { text-align: left; vertical-align: top; padding: 6px 10px; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-weight: 600; font-size: 12.5px; }
td code { white-space: nowrap; }
.lede { font-size: 16.5px; color: var(--muted); max-width: 720px; }
@media (max-width: 800px) { .layout { grid-template-columns: 1fr; } nav.toc { display: none; } h1 { font-size: 25px; } }
</style>
</head>
<body>
<header>
  <a class="brand" href="../"><img src="../icons/icon.svg" alt="" width="20" height="20"><span>Photocairn</span></a>
  <span style="color:var(--muted)">for developers &amp; AI agents</span>
  <a class="open" href="../">Open the editor</a>
</header>
<div class="layout">
  <nav class="toc" aria-label="Contents">
      {{NAV}}
  </nav>
  <main>
<h1>Photocairn for developers and AI agents</h1>
{{CONTENT}}
  </main>
</div>
</body>
</html>
